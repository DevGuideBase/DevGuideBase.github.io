name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the public site (only the files visitors need)
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='schedule.csv' --exclude='*.xlsx' \
            --exclude='README-DEPLOY.txt' --exclude='_build-manifest.json' \
            ./ _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
